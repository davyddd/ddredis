[project]
name = "ddredis"
description = "Redis helpers: generic JSON cache and distributed lock"
version = "0.0.2"
authors = [{ name = "davyddd" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["python", "redis", "cache", "lock", "ddredis"]
# uv_build does not derive these from requires-python (poetry did); PyPI and the pyversions badge read them
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "redis>=5.0,<9",
    "ddutils>=0.2.2,<0.3.0",
]

[project.urls]
Repository = "https://github.com/davyddd/ddredis"

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "ipython==9.16.1",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "parameterized==0.9.0",
    "fakeredis[lua]>=2.26,<3",
    "pydantic>=2.0,<3",  # the cache is tested with pydantic models, the library itself only needs the Serializable protocol
]
linter = [
    "ruff==0.15.10",
    "ty==0.0.15",
    "complexipy==8.0.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
